<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming - Gestão de Pedidos e Produção</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E1410"> 
    <link rel="manifest" href="manifest.json">

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ECEADD; 
            color: #1A1613;
            padding: 15px; 
            margin: 0; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: #FFFFFF; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(30, 20, 16, 0.08); 
            border-top: 5px solid #844C29;
        }
        .logo-topo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-topo img {
            max-width: 140px;
            height: auto;
        }
        h2 { 
            text-align: center; 
            color: #1E1410; 
            font-size: 20px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-full {
            grid-column: span 2;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #844C29;
            display: block;
            margin-top: 10px;
            text-transform: uppercase;
        }
        input, select, textarea, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            border: 1px solid #D9D8CF; 
            border-radius: 6px; 
            font-size: 15px; 
            background-color: #FAFAF7;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #844C29;
            background-color: #FFF;
        }
        .btn-salvar { 
            background-color: #1E1410; 
            color: #ECEADD; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 25px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-salvar:active { background-color: #844C29; }
        
        /* Controlo de Filtros e Ordenação */
        .painel-controle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }
        .filtros-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .btn-filtro {
            background-color: #E5E3D8;
            color: #1E1410;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .btn-filtro.ativo {
            background-color: #844C29;
            color: #FFFFFF;
        }
        .ordenacao-select {
            padding: 8px 12px;
            border-radius: 20px;
            background-color: #E5E3D8;
            color: #1E1410;
            border: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: auto;
            margin-top: 0;
        }

        /* Lista de Pedidos */
        .pedido-card { 
            background: #FAFAF7; 
            padding: 20px; 
            margin-top: 15px; 
            border-left: 5px solid #844C29; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            border: 1px solid #EFEEE9;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E5E3D8;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .pedido-header strong { font-size: 18px; color: #1E1410; }
        .data-pedido { font-size: 13px; color: #777; }
        
        .pedido-detalhes {
            font-size: 15px;
            color: #333;
            margin-bottom: 15px;
        }
        
        /* Badges de Status */
        .status-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-nao { background-color: #f8d7da; color: #721c24; }
        .badge-sim { background-color: #d4edda; color: #155724; }

        .acoes-card {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-acao {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-producao { background: #ffc107; color: #000; }
        .btn-entrega { background: #17a2b8; color: #fff; }
        .btn-pagamento { background: #28a745; color: #fff; }
        .btn-excluir { background: #dc3545
