<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming - Controlo de Produção</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E1410"> 
    <link rel="manifest" href="manifest.json">

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ECEADD; 
            color: #1A1613;
            padding: 15px; 
            margin: 0; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #FFFFFF; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(30, 20, 16, 0.08); 
            border-top: 5px solid #844C29;
        }
        .logo-topo {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-topo img {
            max-width: 140px; /* Tamanho elegante para a logo */
            height: auto;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #844C29;
            display: block;
            margin-top: 12px;
            text-transform: uppercase;
        }
        input, button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            box-sizing: border-box; 
            border: 1px solid #D9D8CF; 
            border-radius: 6px; 
            font-size: 16px; 
            background-color: #FAFAF7;
        }
        input:focus {
            outline: none;
            border-color: #844C29;
            background-color: #FFF;
        }
        button { 
            background-color: #1E1410; 
            color: #ECEADD; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        button:active { 
            background-color: #844C29; 
        }
        .pedido { 
            background: #FAFAF7; 
            padding: 15px; 
            margin-top: 15px; 
            border-left: 4px solid #844C29; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            border-radius: 6px; 
            border-top: 1px solid #EFEEE9;
            border-right: 1px solid #EFEEE9;
            border-bottom: 1px solid #EFEEE9;
        }
        .pedido strong { font-size: 17px; color: #1E1410; }
        .pedido span { color: #555; margin-top: 4px; margin-bottom: 12px; font-size: 15px; }
        .btn-concluir { 
            background: #844C29; 
            margin-top: 0; 
            padding: 10px; 
            font-size: 14px; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            text-transform: uppercase;
        }
        .btn-concluir:active { background: #63381e; }
        #mensagem { color: #844C29; font-weight: bold; text-align: center; margin-top: 15px; display: none; }
        h3 { margin-top: 30px; border-bottom: 2px solid #ECEADD; padding-bottom: 8px; font-size: 16px; color: #1E1410; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo carregada do GitHub -->
        <div class="logo-topo">
            <img src="logo.png" alt="Blooming Logo">
        </div>
        
        <label for="cliente">Cliente / Cafeteria</label>
        <input type="text" id="cliente" placeholder="Ex: Café Central">
        
        <label for="produto">Especificação do Produto</label>
        <input type="text" id="produto" placeholder="Ex: 50 Caixas Drip Coffee - Catuaí">
        
        <button onclick="salvarPedido()">Guardar Pedido</button>
        <p id="mensagem">Pedido guardado com sucesso!</p>

        <h3>Pedidos em Produção:</h3>
        <div id="listaPedidos">
            <p style="color: #777; text-align: center;">A carregar pedidos...</p>
        </div>
    </div>

    <!-- Motores do Firebase e a chave -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzDOvbshvUu5T4QD0OJMuYU26lhNffaW8",
            authDomain: "blooming-app-6a7da.firebaseapp.com",
            projectId: "blooming-app-6a7da",
            storageBucket: "blooming-app-6a7da.firebasestorage.app",
            messagingSenderId: "452997966646",
            appId: "1:452997966646:web:4bbf180e015b87aa9ee197",
            measurementId: "G-RCSVS5G0EP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const pedidosRef = collection(db, "pedidos");
        const divLista = document.getElementById("listaPedidos");

        async function carregarPedidos() {
            divLista.innerHTML = "<p style='color: #777; text-align: center;'>A carregar...</p>";
            
            try {
                const q = query(pedidosRef, orderBy("data", "desc"));
                const querySnapshot = await getDocs(q);
                
                divLista.innerHTML = ""; 

                if (querySnapshot.empty) {
                    divLista.innerHTML = "<p style='color: #777; text-align: center;'>Nenhum pedido em produção no momento.</p>";
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    const id = documento.id;
                    
                    divLista.innerHTML += `
                        <div class="pedido" id="pedido-${id}">
                            <strong>${dados.cliente}</strong>
                            <span>${dados.produto}</span>
                            <button class="btn-concluir" onclick="concluirPedido('${id}')">✔ Concluir Pedido</button>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Erro ao carregar: ", e);
                divLista.innerHTML = "<p style='color: red; text-align: center;'>Erro ao ligar à base de dados.</p>";
            }
        }

        window.salvarPedido = async function() {
            let cliente = document.getElementById("cliente").value;
            let produto = document.getElementById("produto").value;

            if(cliente === "" || produto === "") {
                alert("Por favor, preencha o cliente e o produto!");
                return;
            }

            try {
                await addDoc(pedidosRef, {
                    cliente: cliente,
                    produto: produto,
                    data: new Date().toISOString()
                });
                
                document.getElementById("cliente", produto).value = "";
                document.getElementById("cliente").value = "";
                document.getElementById("produto").value = "";
                
                const msg = document.getElementById("mensagem");
                msg.style.display = "block";
                setTimeout(() => msg.style.display = "none", 3000);

                carregarPedidos();

            } catch (e) {
                console.error("Erro ao guardar: ", e);
                alert("Erro ao guardar o pedido.");
            }
        }

        window.concluirPedido = async function(id) {
            if(confirm("Tem a certeza que quer concluir e remover este pedido?")) {
                try {
                    await deleteDoc(doc(db, "pedidos", id));
                    carregarPedidos();
                } catch (e) {
                    console.error("Erro ao concluir: ", e);
                    alert("Erro ao remover o pedido.");
                }
            }
        }

        carregarPedidos();
    </script>
</body>
</html>
