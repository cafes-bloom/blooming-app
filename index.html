<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming Club - Gestão de Pedidos e Produção</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E1410"> 
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-base: #ECEADD;
            --surface: #FFFFFF;
            --surface-card: #FAFAF7;
            --primary: #1E1410;
            --accent: #844C29;
            --border: #E5E3D8;
            --text-main: #1A1613;
            --text-muted: #777777;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            padding: 12px; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 850px; 
            margin: auto; 
            background: var(--surface); 
            padding: 24px 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(30, 20, 16, 0.06); 
            border-top: 5px solid var(--accent); 
        }

        .header-app { 
            text-align: center; 
            margin-bottom: 20px; 
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header-app img { 
            max-width: 95px; 
            height: auto; 
            margin-bottom: 6px;
        }
        .header-app span {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        /* Botão para abrir o Card de Registo */
        .btn-toggle-form {
            background-color: var(--primary);
            color: var(--bg-base);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 20px;
        }
        .btn-toggle-form:active {
            transform: scale(0.99);
            background-color: var(--accent);
        }

        /* Card de Registo Expansível */
        .form-card-container {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            display: none; /* Fechado por padrão */
            animation: fadeIn 0.25s ease-in-out;
        }
        .form-card-container.aberto {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
        }

        label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--accent); 
            display: block; 
            margin-top: 6px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        input, textarea { 
            width: 100%; 
            padding: 11px 14px; 
            margin-top: 4px; 
            box-sizing: border-box; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            background-color: #FFFFFF; 
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(132, 76, 41, 0.1);
        }

        textarea {
            resize: none;
            overflow: hidden;
            min-height: 44px;
        }

        .btn-salvar { 
            background-color: var(--accent); 
            color: #FFFFFF; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            margin-top: 16px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 13px; 
            border-radius: 8px; 
            width: 100%;
            font-size: 13px;
            transition: background 0.2s; 
        }
        .btn-salvar:hover {
            background-color: #6a3d21;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        h3 { 
            margin: 0; 
            font-size: 13px; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        /* Barra de Filtros limpa */
        .painel-controle { 
            display: flex; 
            margin-bottom: 15px; 
        }

        .filtros-container { 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            padding-bottom: 4px; 
            width: 100%; 
            scrollbar-width: none; 
        }
        .filtros-container::-webkit-scrollbar { 
            display: none; 
        }

        .btn-filtro { 
            background-color: #EFECE6; 
            color: var(--primary); 
            border: none; 
            padding: 7px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            text-transform: uppercase; 
            transition: all 0.2s;
        }
        .btn-filtro.ativo { 
            background-color: var(--accent); 
            color: #FFFFFF; 
            box-shadow: 0 2px 6px rgba(132, 76, 41, 0.25);
        }

        /* Cartões de Pedido */
        .pedido-card { 
            background: var(--surface-card); 
            padding: 16px; 
            margin-top: 12px; 
            border-left: 4px solid var(--accent); 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .pedido-card.entregue {
            opacity: 0.75;
            border-left-color: #0369A1;
        }

        .pedido-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
            margin-bottom: 10px; 
        }
        .pedido-header strong { 
            font-size: 16px; 
            color: var(--primary); 
            letter-spacing: 0.3px;
        }
        .data-pedido { 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        .pedido-detalhes { 
            font-size: 13px; 
            color: #332C27; 
            margin-bottom: 12px; 
            line-height: 1.5; 
        }
        .pedido-detalhes strong {
            color: var(--primary);
        }
        
        .status-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            margin-bottom: 14px; 
        }
        .badge { 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .badge-nao { background-color: #FDF2F2; color: #9B2C2C; border: 1px solid #F5C6CB; }
        .badge-sim { background-color: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }

        .acoes-card { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 6px; 
        }
        .btn-acao { 
            padding: 8px 4px; 
            font-size: 11px; 
            font-weight: 700; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            text-transform: uppercase; 
            text-align: center; 
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-acao:active { transform: scale(0.96); }
        .btn-producao { background: #FEF3C7; color: #92400E; }
        .btn-entrega { background: #E0F2FE; color: #0369A1; }
        .btn-pagamento { background: #DCFCE7; color: #166534; }
        .btn-excluir { background: #FEE2E2; color: #991B1B; }

        @media (max-width: 400px) {
            .acoes-card { grid-template-columns: repeat(2, 1fr); }
        }

        #mensagem { 
            color: var(--accent); 
            font-weight: 700; 
            text-align: center; 
            margin-top: 10px; 
            font-size: 12px;
            display: none; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Topo Sofisticado -->
        <div class="header-app">
            <img src="logo.png" alt="Blooming Club Logo">
            <span>Gestão de Produção</span>
        </div>
        
        <!-- Botão Retátil para Novo Pedido -->
        <button class="btn-toggle-form" onclick="toggleFormulario()">
            <span id="iconeBotaoForm">＋</span> <span id="textoBotaoForm">Registar Novo Pedido</span>
        </button>

        <!-- Card de Registo Expansível -->
        <div id="formCard" class="form-card-container">
            <div class="form-grid">
                <div>
                    <label for="cliente">Nome do Cliente / Cafeteria</label>
                    <input type="text" id="cliente" placeholder="Ex: Café Central">
                </div>
                <div>
                    <label for="descricao">Descrição do Pedido</label>
                    <textarea id="descricao" rows="1" placeholder="Ex: 50 Caixas Drip Coffee - Catuaí Amarelo"></textarea>
                </div>
                <div>
                    <label for="dataEntrega">Data de Entrega Prevista</label>
                    <input type="date" id="dataEntrega">
                </div>
            </div>
            
            <button class="btn-salvar" onclick="salvarPedido()">Guardar Pedido</button>
            <p id="mensagem">Pedido registado com sucesso!</p>
        </div>
        
        <div class="section-header">
            <h3>Pedidos Ativos</h3>
        </div>
        
        <!-- Filtros Rápidos (Pílulas) -->
        <div class="painel-controle">
            <div class="filtros-container">
                <button class="btn-filtro ativo" onclick="filtrar('todos', this)">Todos</button>
                <button class="btn-filtro" onclick="filtrar('producao-nao', this)">Por Produzir</button>
                <button class="btn-filtro" onclick="filtrar('entrega-nao', this)">Por Entregar</button>
                <button class="btn-filtro" onclick="filtrar('pago-nao', this)">Por Pagar</button>
            </div>
        </div>

        <div id="listaPedidos"><p style="color: var(--text-muted); text-align: center; margin-top: 25px; font-size: 13px;">A carregar pedidos...</p></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyDzDOvbshvUu5T4QD0OJMuYU26lhNffaW8", authDomain: "blooming-app-6a7da.firebaseapp.com", projectId: "blooming-app-6a7da", storageBucket: "blooming-app-6a7da.firebasestorage.app", messagingSenderId: "452997966646", appId: "1:452997966646:web:4bbf180e015b87aa9ee197", measurementId: "G-RCSVS5G0EP" };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const pedidosRef = collection(db, "pedidos");
        const divLista = document.getElementById("listaPedidos");
        let cachePedidos = []; 
        let filtroAtual = 'todos';

        // Controle de abertura/fecho do card de formulário
        window.toggleFormulario = function() {
            const card = document.getElementById("formCard");
            const icone = document.getElementById("iconeBotaoForm");
            const texto = document.getElementById("textoBotaoForm");
            
            card.classList.toggle("aberto");
            if(card.classList.contains("aberto")) {
                icone.innerText = "✕";
                texto.innerText = "Fechar Formulário";
                document.getElementById("cliente").focus();
            } else {
                icone.innerText = "＋";
                texto.innerText = "Registar Novo Pedido";
            }
        }

        const textareaDescricao = document.getElementById("descricao");
        textareaDescricao.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        function formatarData(dataISO) { 
            if (!dataISO) return "Não definida"; 
            const partes = dataISO.split("-"); 
            if(partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`; 
            return dataISO; 
        }

        async function carregarPedidos() {
            const posicaoAtualScroll = window.scrollY;
            try {
                const q = query(pedidosRef, orderBy("criadoEm", "desc"));
                const querySnapshot = await getDocs(q);
                cachePedidos = [];
                querySnapshot.forEach((documento) => { 
                    cachePedidos.push({ id: documento.id, ...documento.data() }); 
                });
                desenharLista();
                window.scrollTo(0, posicaoAtualScroll);
            } catch (e) { 
                console.error("Erro ao carregar: ", e); 
                divLista.innerHTML = "<p style='color: #991B1B; text-align: center;'>Erro ao ligar à base de dados.</p>"; 
            }
        }

        window.filtrar = function(tipo, elementoBotao) { 
            filtroAtual = tipo; 
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo')); 
            elementoBotao.classList.add('ativo'); 
            desenharLista(); 
        }

        function desenharLista() {
            divLista.innerHTML = "";
            
            // 1. FILTRO AUTOMÁTICO: O que já foi pago sai da tela (arquivado)
            let pedidosProcessados = cachePedidos.filter(p => {
                if (p.pago) return false; 
                
                if (filtroAtual === 'producao-nao') return !p.produzido;
                if (filtroAtual === 'entrega-nao') return !p.entregue;
                if (filtroAtual === 'pago-nao') return !p.pago;
                return true;
            });
            
            // 2. ORDENAÇÃO AUTOMÁTICA INTELIGENTE
            pedidosProcessados.sort((a, b) => {
                // REGRA A: O que já foi entregue desce automaticamente para o final da lista
                if (a.entregue !== b.entregue) {
                    return a.entregue ? 1 : -1; 
                }

                // REGRA B: Ordena automaticamente por Data de Entrega (mais próxima primeiro)
                if (!a.dataEntrega) return 1; 
                if (!b.dataEntrega) return -1; 
                return new Date(a.dataEntrega) - new Date(b.dataEntrega);
            });

            if (pedidosProcessados.length === 0) { 
                divLista.innerHTML = "<p style='color: var(--text-muted); text-align: center; margin-top: 25px; font-size: 13px;'>Nenhum pedido pendente encontrado.</p>"; 
                return; 
            }

            pedidosProcessados.forEach((p) => {
                const id = p.id;
                const badgeProd = p.produzido ? `<span class="badge badge-sim">Prod: Sim</span>` : `<span class="badge badge-nao">Prod: Não</span>`;
                const badgeEnt = p.entregue ? `<span class="badge badge-sim">Entr: Sim</span>` : `<span class="badge badge-nao">Entr: Não</span>`;
                const badgePag = p.pago ? `<span class="badge badge-sim">Pago: Sim</span>` : `<span class="badge badge-nao">Pago: Não</span>`;
                
                const classeEntregue = p.entregue ? "pedido-card entregue" : "pedido-card";
                
                divLista.innerHTML += `
                    <div class="${classeEntregue}">
                        <div class="pedido-header">
                            <strong>${p.cliente}</strong>
                            <span class="data-pedido">${formatarData(p.dataPedido)}</span>
                        </div>
                        <div class="pedido-detalhes">
                            <strong>Descrição:</strong> ${p.descricao} <br>
                            <strong>Entrega:</strong> ${formatarData(p.dataEntrega)}
                        </div>
                        <div class="status-container">${badgeProd}${badgeEnt}${badgePag}</div>
                        <div class="acoes-card">
                            <button class="btn-acao btn-producao" onclick="alternarStatus('${id}', 'produzido', ${!p.produzido})">⚙ Prod</button>
                            <button class="btn-acao btn-entrega" onclick="alternarStatus('${id}', 'entregue', ${!p.entregue})">🚚 Entr</button>
                            <button class="btn-acao btn-pagamento" onclick="confirmarPagamento('${id}', ${!p.pago})">💰 Pag</button>
                            <button class="btn-acao btn-excluir" onclick="apagarPedido('${id}')">🗑 Apagar</button>
                        </div>
                    </div>
                `;
            });
        }

        window.salvarPedido = async function() {
            let cliente = document.getElementById("cliente").value;
            let descricao = document.getElementById("descricao").value;
            let dataEntrega = document.getElementById("dataEntrega").value;
            
            if(cliente === "" || descricao === "") { 
                alert("Por favor, preencha o nome do cliente e a descrição do pedido!"); 
                return; 
            }
            
            const hoje = new Date().toISOString().split('T')[0];
            try {
                await addDoc(pedidosRef, { 
                    cliente: cliente, 
                    descricao: descricao, 
                    dataPedido: hoje, 
                    dataEntrega: dataEntrega, 
                    pagamentoForma: "Não informada", 
                    produzido: false, 
                    entregue: false, 
                    pago: false, 
                    criadoEm: new Date().toISOString() 
                });
                
                // Limpa os campos
                document.getElementById("cliente").value = ""; 
                document.getElementById("descricao").value = ""; 
                document.getElementById("descricao").style.height = "auto";
                document.getElementById("dataEntrega").value = "";
                
                // Feedback e fecho automático do card
                const msg = document.getElementById("mensagem"); 
                msg.style.display = "block"; 
                setTimeout(() => {
                    msg.style.display = "none";
                    toggleFormulario(); // Fecha o formulário automaticamente
                }, 1200);

                carregarPedidos();
            } catch (e) { 
                console.error("Erro ao guardar: ", e); 
                alert("Erro ao guardar o pedido."); 
            }
        }

        window.alternarStatus = async function(id, campo, novoValor) {
            try { 
                const docRef = doc(db, "pedidos", id); 
                let dadosAtualizados = {}; 
                dadosAtualizados[campo] = novoValor; 
                await updateDoc(docRef, dadosAtualizados); 
                carregarPedidos(); 
            } catch (e) { 
                console.error("Erro ao atualizar status: ", e); 
                alert("Erro ao atualizar o estado do pedido."); 
            }
        }

        window.confirmarPagamento = async function(id, novoValor) {
            if (novoValor) {
                if (confirm("Confirma que este pedido foi pago? Ele será arquivado e sairá da tela ativa.")) {
                    window.alternarStatus(id, 'pago', true);
                }
            } else {
                window.alternarStatus(id, 'pago', false);
            }
        }

        window.apagarPedido = async function(id) {
            if(confirm("Tem a certeza que deseja apagar este registo?")) {
                try { 
                    await deleteDoc(doc(db, "pedidos", id)); 
                    carregarPedidos(); 
                } catch (e) { 
                    console.error("Erro ao apagar: ", e); 
                    alert("Erro ao remover o registo."); 
                }
            }
        }

        carregarPedidos();
    </script>
</body>
</html>
