<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming Club - Gestão de Pedidos e Produção</title>
    
    <!-- Bloqueia o rastreamento por motores de busca -->
    <meta name="robots" content="noindex, nofollow">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E1410"> 
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-base: #ECEADD;
            --surface: #FFFFFF;
            --surface-card: #FAFAF7;
            --primary: #1E1410;
            --accent: #844C29;
            --border: #E5E3D8;
            --text-main: #1A1613;
            --text-muted: #777777;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            padding: 12px; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 850px; 
            margin: auto; 
            background: var(--surface); 
            padding: 24px 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(30, 20, 16, 0.06); 
            border-top: 5px solid var(--accent); 
        }

        .header-app { 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px; 
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header-app img { 
            max-width: 120px; 
            height: auto; 
        }
        .header-app span {
            font-size: 14px; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            border-left: 2px solid var(--accent);
            padding-left: 16px;
            margin-left: 16px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-toggle-form {
            background-color: var(--primary);
            color: var(--bg-base);
            border: none;
            flex: 1; 
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-toggle-form:active {
            transform: scale(0.99);
            background-color: var(--accent);
        }

        .btn-arquivados {
            background-color: #E5E3D8;
            color: var(--primary);
            border: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-arquivados.ativo-arq {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .form-card-container {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.25s ease-in-out;
        }
        .form-card-container.aberto {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
        }

        label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--accent); 
            display: block; 
            margin-top: 6px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], textarea { 
            width: 100%; 
            padding: 11px 14px; 
            margin-top: 4px; 
            box-sizing: border-box; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            background-color: #FFFFFF; 
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(132, 76, 41, 0.1);
        }

        textarea {
            resize: none;
            overflow: hidden;
            min-height: 44px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            background: #F0EDE4;
            padding: 10px;
            border-radius: 8px;
        }
        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin: 0;
            accent-color: var(--accent);
            transform: scale(1.2);
        }
        .checkbox-container label {
            margin: 0;
            text-transform: none;
            letter-spacing: normal;
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
        }

        .btn-salvar { 
            background-color: var(--accent); 
            color: #FFFFFF; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            margin-top: 16px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 13px; 
            border-radius: 8px; 
            width: 100%;
            font-size: 13px;
            transition: background 0.2s; 
        }
        .btn-salvar:hover {
            background-color: #6a3d21;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        h3 { 
            margin: 0; 
            font-size: 13px; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        .painel-controle { 
            display: flex; 
            margin-bottom: 15px; 
        }

        .filtros-container { 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            padding-bottom: 4px; 
            width: 100%; 
            scrollbar-width: none; 
        }
        .filtros-container::-webkit-scrollbar { 
            display: none; 
        }

        .btn-filtro { 
            background-color: #EFECE6; 
            color: var(--primary); 
            border: none; 
            padding: 7px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            text-transform: uppercase; 
            transition: all 0.2s;
        }
        .btn-filtro.ativo { 
            background-color: var(--accent); 
            color: #FFFFFF; 
            box-shadow: 0 2px 6px rgba(132, 76, 41, 0.25);
        }

        .pedido-card { 
            background: var(--surface-card); 
            padding: 16px; 
            margin-top: 12px; 
            border-left: 4px solid var(--accent); 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .pedido-card.entregue {
            opacity: 0.75;
            border-left-color: #0369A1;
        }

        .pedido-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
            margin-bottom: 10px; 
        }
        .pedido-header strong { 
            font-size: 16px; 
            color: var(--primary); 
            letter-spacing: 0.3px;
        }
        .data-pedido { 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        .pedido-detalhes { 
            font-size: 13px; 
            color: #332C27; 
            margin-bottom: 12px; 
            line-height: 1.5; 
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .pedido-detalhes strong {
            color: var(--primary);
        }

        .valor-destaque {
            color: #15803D;
            font-weight: 700;
        }

        .btn-editar-item {
            background: #EFECE6;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 6px;
            color: var(--primary);
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-editar-item:hover {
            background: #E5E3D8;
        }
        
        .status-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            margin-bottom: 14px; 
        }
        .badge { 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .badge-nao { background-color: #FDF2F2; color: #9B2C2C; border: 1px solid #F5C6CB; }
        .badge-sim { background-color: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }

        .acoes-card { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 6px; 
        }
        .btn-acao { 
            padding: 8px 4px; 
            font-size: 11px; 
            font-weight: 700; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            text-transform: uppercase; 
            text-align: center; 
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-acao:active { transform: scale(0.96); }
        .btn-producao { background: #FEF3C7; color: #92400E; }
        .btn-entrega { background: #E0F2FE; color: #0369A1; }
        .btn-pagamento { background: #DCFCE7; color: #166534; }
        .btn-excluir { background: #FEE2E2; color: #991B1B; }

        @media (max-width: 400px) {
            .acoes-card { grid-template-columns: repeat(2, 1fr); }
        }

        #mensagem { 
            color: var(--accent); 
            font-weight: 700; 
            text-align: center; 
            margin-top: 10px; 
            font-size: 12px;
            display: none; 
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(30, 20, 16, 0.6); 
            align-items: center; 
            justify-content: center; 
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface); 
            padding: 24px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Topo -->
        <div class="header-app">
            <img src="logo.png" alt="Blooming Club Logo">
            <span>Gestão de Produção</span>
        </div>
        
        <!-- Botões -->
        <div class="header-actions">
            <button class="btn-toggle-form" onclick="toggleFormulario()">
                <span id="iconeBotaoForm">＋</span> <span id="textoBotaoForm">Registar Novo Pedido</span>
            </button>
            <button id="btnArquivados" class="btn-arquivados" onclick="toggleArquivados()" title="Ver pedidos finalizados">
                📦 Arquivo
            </button>
        </div>

        <!-- Formulário -->
        <div id="formCard" class="form-card-container">
            <div class="form-grid">
                <div>
                    <label for="cliente">Nome do Cliente / Cafeteria</label>
                    <input type="text" id="cliente" placeholder="Ex: Café Central">
                </div>
                <div>
                    <label for="descricao">Descrição do Pedido</label>
                    <textarea id="descricao" rows="1" placeholder="Ex: 50 Caixas Drip Coffee - Catuaí Amarelo"></textarea>
                </div>
                <div>
                    <label for="preco">Valor do Pedido (Opcional)</label>
                    <input type="text" id="preco" placeholder="Ex: 150,00">
                </div>
                <div>
                    <label for="dataEntrega">Data de Entrega</label>
                    <input type="date" id="dataEntrega">
                    <div class="checkbox-container">
                        <input type="checkbox" id="previsaoData">
                        <label for="previsaoData">Esta data é apenas uma previsão (A combinar)</label>
                    </div>
                </div>
            </div>
            
            <button class="btn-salvar" onclick="salvarPedido()">Guardar Pedido</button>
            <p id="mensagem">Pedido registado com sucesso!</p>
        </div>
        
        <div class="section-header">
            <h3 id="tituloSecao">Pedidos Ativos</h3>
        </div>
        
        <!-- Filtros -->
        <div id="painelFiltros" class="painel-controle">
            <div class="filtros-container">
                <button class="btn-filtro ativo" onclick="filtrar('todos', this)">Todos</button>
                <button class="btn-filtro" onclick="filtrar('producao-nao', this)">Por Produzir</button>
                <button class="btn-filtro" onclick="filtrar('entrega-nao', this)">Por Entregar</button>
                <button class="btn-filtro" onclick="filtrar('pago-nao', this)">Por Pagar</button>
            </div>
        </div>

        <div id="listaPedidos"><p style="color: var(--text-muted); text-align: center; margin-top: 25px; font-size: 13px;">A carregar pedidos...</p></div>
    </div>

    <!-- Modal Flutuante para Edição da Data -->
    <div id="modalEditarData" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Definir Data Oficial</h3>
            <label for="inputNovaData">Nova Data de Entrega:</label>
            <input type="date" id="inputNovaData" style="margin-bottom: 16px;">
            <div style="display: flex; gap: 10px;">
                <button class="btn-salvar" onclick="salvarNovaData()" style="margin-top: 0; background-color: var(--accent);">Guardar</button>
                <button class="btn-salvar" onclick="fecharModalData()" style="margin-top: 0; background-color: #9CA3AF;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Flutuante para Edição da Descrição -->
    <div id="modalEditarDescricao" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Editar Descrição</h3>
            <label for="inputNovaDescricao">Descrição do Pedido:</label>
            <textarea id="inputNovaDescricao" rows="3" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; margin-top: 4px;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-salvar" onclick="salvarNovaDescricao()" style="margin-top: 0; background-color: var(--accent);">Guardar</button>
                <button class="btn-salvar" onclick="fecharModalDescricao()" style="margin-top: 0; background-color: #9CA3AF;">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyDzDOvbshvUu5T4QD0OJMuYU26lhNffaW8", authDomain: "blooming-app-6a7da.firebaseapp.com", projectId: "blooming-app-6a7da", storageBucket: "blooming-app-6a7da.firebasestorage.app", messagingSenderId: "452997966646", appId: "1:452997966646:web:4bbf180e015b87aa9ee197", measurementId: "G-RCSVS5G0EP" };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const pedidosRef = collection(db, "pedidos");
        const divLista = document.getElementById("listaPedidos");
        let cachePedidos = []; 
        let filtroAtual = 'todos';
        let pedidoEditandoId = null;

        window.toggleFormulario = function() {
            const card = document.getElementById("formCard");
            const icone = document.getElementById("iconeBotaoForm");
            const texto = document.getElementById("textoBotaoForm");
            
            card.classList.toggle("aberto");
            if(card.classList.contains("aberto")) {
                icone.innerText = "✕";
                texto.innerText = "Fechar Formulário";
                document.getElementById("cliente").focus();
            } else {
                icone.innerText = "＋";
                texto.innerText = "Registar Novo Pedido";
            }
        }

        window.toggleArquivados = function() {
            const btn = document.getElementById("btnArquivados");
            const titulo = document.getElementById("tituloSecao");
            const painelFiltros = document.getElementById("painelFiltros");
            
            if (filtroAtual === 'arquivados') {
                filtroAtual = 'todos';
                btn.innerHTML = "📦 Arquivo";
                btn.classList.remove('ativo-arq');
                titulo.innerText = "Pedidos Ativos";
                painelFiltros.style.display = "flex";
                
                document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
                document.querySelector('.btn-filtro').classList.add('ativo');
            } else {
                filtroAtual = 'arquivados';
                btn.innerHTML = "← Voltar Ativos";
                btn.classList.add('ativo-arq');
                titulo.innerText = "Pedidos Arquivados (Concluídos)";
                painelFiltros.style.display = "none"; 
            }
            desenharLista();
        }

        const textareaDescricao = document.getElementById("descricao");
        textareaDescricao.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        function formatarData(dataISO) { 
            if (!dataISO) return "Não definida"; 
            const partes = dataISO.split("-"); 
            if(partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`; 
            return dataISO; 
        }

        async function carregarPedidos() {
            const posicaoAtualScroll = window.scrollY;
            try {
                const q = query(pedidosRef, orderBy("criadoEm", "desc"));
                const querySnapshot = await getDocs(q);
                cachePedidos = [];
                querySnapshot.forEach((documento) => { 
                    cachePedidos.push({ id: documento.id, ...documento.data() }); 
                });
                desenharLista();
                window.scrollTo(0, posicaoAtualScroll);
            } catch (e) { 
                console.error("Erro ao carregar: ", e); 
                divLista.innerHTML = "<p style='color: #991B1B; text-align: center;'>Erro ao ligar à base de dados.</p>"; 
            }
        }

        window.filtrar = function(tipo, elementoBotao) { 
            filtroAtual = tipo; 
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo')); 
            elementoBotao.classList.add('ativo'); 
            desenharLista(); 
        }

        // --- Modal Edição de Data ---
        window.abrirModalData = function(id, dataAtual) {
            pedidoEditandoId = id;
            document.getElementById("inputNovaData").value = dataAtual;
            document.getElementById("modalEditarData").style.display = "flex";
        }

        window.fecharModalData = function() {
            document.getElementById("modalEditarData").style.display = "none";
            pedidoEditandoId = null;
        }

        window.salvarNovaData = async function() {
            const novaData = document.getElementById("inputNovaData").value;
            if (!novaData) {
                alert("Por favor, selecione uma data válida.");
                return;
            }
            try {
                const docRef = doc(db, "pedidos", pedidoEditandoId);
                await updateDoc(docRef, {
                    dataEntrega: novaData,
                    previsaoData: false 
                });
                fecharModalData();
                carregarPedidos(); 
            } catch (e) {
                console.error("Erro ao atualizar a data: ", e);
                alert("Erro ao atualizar a data do pedido.");
            }
        }

        // --- Modal Edição de Descrição ---
        window.abrirModalDescricao = function(id) {
            const p = cachePedidos.find(item => item.id === id);
            if (!p) return;
            pedidoEditandoId = id;
            document.getElementById("inputNovaDescricao").value = p.descricao || "";
            document.getElementById("modalEditarDescricao").style.display = "flex";
        }

        window.fecharModalDescricao = function() {
            document.getElementById("modalEditarDescricao").style.display = "none";
            pedidoEditandoId = null;
        }

        window.salvarNovaDescricao = async function() {
            const novaDesc = document.getElementById("inputNovaDescricao").value.trim();
            if (!novaDesc) {
                alert("Por favor, preencha a descrição do pedido.");
                return;
            }
            try {
                const docRef = doc(db, "pedidos", pedidoEditandoId);
                await updateDoc(docRef, { descricao: novaDesc });
                fecharModalDescricao();
                carregarPedidos();
            } catch (e) {
                console.error("Erro ao atualizar a descrição: ", e);
                alert("Erro ao atualizar a descrição do pedido.");
            }
        }

        function desenharLista() {
            divLista.innerHTML = "";
            
            let pedidosProcessados = cachePedidos.filter(p => {
                const estaConcluido = p.produzido === true && p.entregue === true && p.pago === true;

                if (filtroAtual === 'arquivados') {
                    return estaConcluido;
                }
                
                if (estaConcluido) return false; 
                
                if (filtroAtual === 'producao-nao') return !p.produzido;
                if (filtroAtual === 'entrega-nao') return !p.entregue;
                if (filtroAtual === 'pago-nao') return !p.pago;
                return true;
            });
            
            pedidosProcessados.sort((a, b) => {
                if (a.entregue !== b.entregue) {
                    return a.entregue ? 1 : -1; 
                }
                if (!a.dataEntrega) return 1; 
                if (!b.dataEntrega) return -1; 
                return new Date(a.dataEntrega) - new Date(b.dataEntrega);
            });

            if (pedidosProcessados.length === 0) { 
                divLista.innerHTML = "<p style='color: var(--text-muted); text-align: center; margin-top: 25px; font-size: 13px;'>Nenhum pedido encontrado nesta vista.</p>"; 
                return; 
            }

            pedidosProcessados.forEach((p) => {
                const id = p.id;
                const badgeProd = p.produzido ? `<span class="badge badge-sim">Prod: Sim</span>` : `<span class="badge badge-nao">Prod: Não</span>`;
                const badgeEnt = p.entregue ? `<span class="badge badge-sim">Entr: Sim</span>` : `<span class="badge badge-nao">Entr: Não</span>`;
                const badgePag = p.pago ? `<span class="badge badge-sim">Pago: Sim</span>` : `<span class="badge badge-nao">Pago: Não</span>`;
                
                const classeEntregue = p.entregue ? "pedido-card entregue" : "pedido-card";
                
                let infoPreco = p.preco ? `<strong>Valor:</strong> <span class="valor-destaque">${p.preco}</span> <br>` : '';

                let infoData = `<strong>Entrega:</strong> ${formatarData(p.dataEntrega)}`;
                if (p.previsaoData) {
                    infoData = `<span style="color: #D97706; font-weight: 700;">Previsão: ${formatarData(p.dataEntrega)} ⏳ (A combinar)</span>`;
                }
                
                infoData += ` <button class="btn-editar-item" onclick="abrirModalData('${id}', '${p.dataEntrega || ''}')" title="Alterar Data Oficial">✏️ Editar</button>`;

                divLista.innerHTML += `
                    <div class="${classeEntregue}">
                        <div class="pedido-header">
                            <strong>${p.cliente}</strong>
                            <span class="data-pedido">${formatarData(p.dataPedido)}</span>
                        </div>
                        <div class="pedido-detalhes">
                            <strong>Descrição:</strong> ${p.descricao} 
                            <button class="btn-editar-item" onclick="abrirModalDescricao('${id}')" title="Editar Descrição">✏️ Editar</button> <br>
                            ${infoPreco}
                            <div style="margin-top: 6px;">${infoData}</div>
                        </div>
                        <div class="status-container">${badgeProd}${badgeEnt}${badgePag}</div>
                        <div class="acoes-card">
                            <button class="btn-acao btn-producao" onclick="alternarStatus('${id}', 'produzido', ${!p.produzido})">⚙ Prod</button>
                            <button class="btn-acao btn-entrega" onclick="alternarStatus('${id}', 'entregue', ${!p.entregue})">🚚 Entr</button>
                            <button class="btn-acao btn-pagamento" onclick="alternarStatus('${id}', 'pago', ${!p.pago})">💰 Pag</button>
                            <button class="btn-acao btn-excluir" onclick="apagarPedido('${id}')">🗑 Apagar</button>
                        </div>
                    </div>
                `;
            });
        }

        window.salvarPedido = async function() {
            let cliente = document.getElementById("cliente").value;
            let descricao = document.getElementById("descricao").value;
            let preco = document.getElementById("preco").value;
            let dataEntrega = document.getElementById("dataEntrega").value;
            let isPrevisao = document.getElementById("previsaoData").checked; 
            
            if(cliente === "" || descricao === "") { 
                alert("Por favor, preencha o nome do cliente e a descrição do pedido!"); 
                return; 
            }
            
            const hoje = new Date().toISOString().split('T')[0];
            try {
                await addDoc(pedidosRef, { 
                    cliente: cliente, 
                    descricao: descricao, 
                    preco: preco,
                    dataPedido: hoje, 
                    dataEntrega: dataEntrega,
                    previsaoData: isPrevisao, 
                    pagamentoForma: "Não informada", 
                    produzido: false, 
                    entregue: false, 
                    pago: false, 
                    criadoEm: new Date().toISOString() 
                });
                
                document.getElementById("cliente").value = ""; 
                document.getElementById("descricao").value = ""; 
                document.getElementById("preco").value = "";
                document.getElementById("descricao").style.height = "auto";
                document.getElementById("dataEntrega").value = "";
                document.getElementById("previsaoData").checked = false; 
                
                const msg = document.getElementById("mensagem"); 
                msg.style.display = "block"; 
                setTimeout(() => {
                    msg.style.display = "none";
                    toggleFormulario(); 
                }, 1200);

                carregarPedidos();
            } catch (e) { 
                console.error("Erro ao guardar: ", e); 
                alert("Erro ao guardar o pedido."); 
            }
        }

        window.alternarStatus = async function(id, campo, novoValor) {
            const pedido = cachePedidos.find(p => p.id === id);
            if (!pedido) return;

            const estadoFuturo = {
                produzido: campo === 'produzido' ? novoValor : (pedido.produzido || false),
                entregue: campo === 'entregue' ? novoValor : (pedido.entregue || false),
                pago: campo === 'pago' ? novoValor : (pedido.pago || false)
            };

            const ficaraConcluido = estadoFuturo.produzido && estadoFuturo.entregue && estadoFuturo.pago;
            const jaEstavaConcluido = pedido.produzido && pedido.entregue && pedido.pago;

            if (ficaraConcluido && !jaEstavaConcluido) {
                const confirmou = confirm("Todas as 3 etapas (Produção, Entrega e Pagamento) foram concluídas. Confirma que deseja arquivar este pedido?");
                if (!confirmou) {
                    return; 
                }
            }

            try { 
                const docRef = doc(db, "pedidos", id); 
                let dadosAtualizados = {}; 
                dadosAtualizados[campo] = novoValor; 
                await updateDoc(docRef, dadosAtualizados); 
                carregarPedidos(); 
            } catch (e) { 
                console.error("Erro ao atualizar status: ", e); 
                alert("Erro ao atualizar o estado do pedido."); 
            }
        }

        window.apagarPedido = async function(id) {
            if(confirm("Tem a certeza que deseja apagar este registo?")) {
                try { 
                    await deleteDoc(doc(db, "pedidos", id)); 
                    carregarPedidos(); 
                } catch (e) { 
                    console.error("Erro ao apagar: ", e); 
                    alert("Erro ao remover o registo."); 
                }
            }
        }

        carregarPedidos();
    </script>
</body>
</html>
